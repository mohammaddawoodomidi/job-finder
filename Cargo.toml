[package]
name = "job-finder"
version = "2.1.0"
edition = "2021"
description = "Finds entry-level / no-experience jobs on websites and Telegram channels"
license = "MIT"
build = "build.rs"
default-run = "job-finder"

[[bin]]
name = "job-finder"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
csv = "1"
encoding_rs = "0.8"
fancy-regex = "0.19"
flate2 = "1"
headless_chrome = "1"
open = "5"
quick-xml = "0.42"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
scraper = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
tiny_http = "0.12"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json"] }
url = "2"

[target.'cfg(windows)'.dependencies]
ureq = { version = "3", features = ["json", "win-system-proxy"] }
wry = "0.57"
tao = "0.37"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
